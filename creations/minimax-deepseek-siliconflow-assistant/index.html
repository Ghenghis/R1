<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=240, height=282, initial-scale=1" />
    <title>R1 Assistant</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <button id="providerBtn" class="pill" title="Switch provider">minimax</button>
        <button id="modeBtn" class="pill" title="Switch mode">chat</button>
      </header>

      <main id="transcript" aria-live="polite"></main>

      <footer id="composer">
        <input
          id="input"
          type="text"
          autocomplete="off"
          placeholder="Ask… (PTT / Enter)"
        />
        <button id="sendBtn" title="Ask AI">▸</button>
      </footer>

      <div id="status"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
